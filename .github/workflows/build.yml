name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: basedare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: basedare/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Block high and critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Check patched validation and wallet schema compatibility
        run: node --test scripts/validation-dependency-security.test.mjs

      - name: Prevent credential leaks across HTTP redirects
        run: npm run test:http-redirect-security

      - name: Run static production safety checks
        run: npm run safety:static

      - name: Expired refund safety regression
        run: npm run test:refund-safety

      - name: Test database release gate
        run: node --test scripts/database-release-check.test.mjs

      - name: Test Prisma configuration dependency safety
        run: npm run test:prisma-config

      - name: Test wallet and venue usability flows
        run: npm run test:usability

      - name: Community identity regression checks
        run: npm run test:community-identity
      
      - name: Adventure discovery regression checks
        run: npm run test:discovery

      - name: Social Moment policy checks
        run: npm run test:moments

      - name: Social Moment forward migration and privacy regression
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          npm run test:adventure-sharing:db

      - name: Business request and delivery regression
        run: npm run test:revenue-focus

      - name: Passport database regression
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          npm run test:passport:db

      - name: Buyer intake and delivery database regression
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          npm run test:revenue:db

      - name: Creator onboarding authorization regression
        run: npm run test:creator-onboarding

      - name: Check local-spend pilot boundaries
        run: npm run test:local-spend

      - name: Read-only funding audit regression
        run: node --test scripts/funding-audit.test.mjs

      - name: Livepeer stream client regression
        run: npm run test:livepeer-stream

      - name: Run linter
        run: npm run lint
      
      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: basedare/.next
          retention-days: 7
